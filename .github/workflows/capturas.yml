name: Capturas de tela
on:
  push:
    branches: [ajuste-pc]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx firebase emulators:exec --only auth,firestore --project demo-portal-p3 "npx playwright test -c playwright.capturas.config.ts"
      - name: Publica as fotos no ramo capturas-tela
        if: always()
        run: |
          cd capturas && git init -q && git checkout -q -b capturas-tela && git add . \
          && git -c user.name=ci -c user.email=ci@x commit -qm capturas \
          && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas-tela
